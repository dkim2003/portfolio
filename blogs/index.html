<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blogs — Kim Duhyun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --white: #ffffff;
      --dark: #1a1a1a;
      --mid: #4a4a4a;
      --light: #8a8a8a;
      --rule: #e0ddd8;
    }

    html { scroll-behavior: smooth; scrollbar-gutter: stable; }

    body {
      background: var(--bg);
      color: var(--dark);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      padding: 0 60px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--dark);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 40px; list-style: none; }

    .nav-links a {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--light);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--dark); }
    .nav-links a.active { color: var(--dark); }

    .divider { border: none; border-top: 1px solid var(--rule); margin: 0 60px; }

    .page-header {
      padding: 140px 60px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header-label {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--light);
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(2.5rem, 4vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .page-header h1 em { font-style: italic; color: var(--mid); }

    .section { max-width: 1200px; margin: 0 auto; padding: 80px 60px; flex: 1; }

    .posts-body { display: grid; grid-template-columns: 160px 1fr; gap: 60px; }

    .posts-label {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--light);
      padding-top: 6px;
    }

    a.post-card-link { display: block; text-decoration: none; color: inherit; }
    a.post-card-link:hover .post-card { background: var(--bg); }

    .post-card {
      border: 1px solid var(--rule);
      padding: 36px 40px;
      background: var(--white);
      transition: background 0.2s;
    }

    .post-course {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--light);
      margin-bottom: 12px;
    }

    .post-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 300;
      color: var(--dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .post-title em { font-style: italic; color: var(--mid); }

    .post-desc {
      font-size: 0.82rem;
      color: var(--mid);
      margin-bottom: 20px;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-date {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--light);
    }

    .post-badge {
      font-size: 0.60rem;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1px solid var(--rule);
      color: var(--light);
      background: var(--bg);
    }

    footer {
      background: var(--dark);
      border-top: 1px solid #222;
      padding: 24px 60px;
      display: flex;
      justify-content: space-between;
    }

    .footer-copy { font-size: 0.65rem; letter-spacing: 0.08em; color: #444; }

    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .nav-links { display: none; }
      .page-header { padding: 120px 24px 60px; }
      .divider { margin: 0 24px; }
      .section { padding: 60px 24px; }
      .posts-body { grid-template-columns: 1fr; gap: 24px; }
      .posts-body > :first-child { display: none; }
      footer { flex-direction: column; gap: 8px; padding: 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Kim Duhyun</a>
    <ul class="nav-links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#experience">Experience</a></li>
      <li><a href="/#skills">Skills</a></li>
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/blogs" class="active">Blogs</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-header-label">Writing</div>
    <h1>Blogs &amp; writing.</h1>
  </div>

  <hr class="divider" />

  <section class="section">
    <div class="posts-body">
      <div class="posts-label">Posts</div>
      <div>
        <a href="/blogs/scie1110" class="post-card-link">
          <div class="post-card">
            <div class="post-course">SCIE 1110 — Science &amp; Society</div>
            <div class="post-title">Blog post coming soon.</div>
            <div class="post-desc">Informative Research Blog</div>
            <div class="post-meta">
              <span class="post-date">2026</span>
              <span class="post-badge">Upcoming</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-copy">© 2026 Kim Duhyun · kimduhyun.com</div>
    <div class="footer-copy">Vancouver, BC · Canada</div>
  </footer>

</body>
</html>
